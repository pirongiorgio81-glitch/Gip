<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a0010">
  <meta name="description" content="Shop — Il Labirinto di Gip">
  <title>Shop — Il Labirinto di Gip</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <!-- IMPORTMAP PER THREE.JS -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Dancing+Script:wght@600;700&family=Source+Sans+3:wght@400;500;600;700;800&display=swap');

    :root{
      --bg:#18000e;
      --pink:#ff4f93;
      --pink-light:#ffd2e3;
      --gold:#ffd166;
      --coin:#ffd54a;
      --green:#55dc8b;
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body{
      width:100vw;
      height:100vh;
      height:100dvh;
      margin:0;
      overflow:hidden;
      background:var(--bg);
      color:#fff7fb;
      font-family:"Source Sans 3", Arial, sans-serif;
      touch-action:manipulation;
    }

    body{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 50% 25%, #822359 0%, #3c0827 42%, #18000e 100%);
    }

    .maze{
      position:fixed;
      inset:-20%;
      opacity:.3;
      background-image:
        linear-gradient(90deg, rgba(255,157,198,.2) 2px, transparent 2px),
        linear-gradient(rgba(255,157,198,.2) 2px, transparent 2px);
      background-size:52px 52px;
      transform:rotate(-8deg);
      mask-image:radial-gradient(circle at center, black 15%, transparent 72%);
      -webkit-mask-image:radial-gradient(circle at center, black 15%, transparent 72%);
      pointer-events:none;
      animation:mazeMove 22s linear infinite;
    }

    .glow{
      position:fixed;
      width:min(94vw, 560px);
      aspect-ratio:1;
      border-radius:50%;
      background:rgba(255,89,155,.2);
      filter:blur(38px);
      pointer-events:none;
      animation:glowPulse 3.4s ease-in-out infinite;
    }

    .shop{
      position:relative;
      z-index:2;
      width:min(94vw, 560px);
      max-height:calc(100dvh - 20px);
      padding:
        calc(20px + var(--safe-top))
        16px
        calc(20px + var(--safe-bottom));
      overflow-y:auto;
      overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      border:1px solid rgba(255,203,225,.55);
      border-radius:26px;
      background:
        linear-gradient(145deg, rgba(118,23,70,.95), rgba(38,1,23,.97));
      text-align:center;
      box-shadow:
        0 20px 70px rgba(0,0,0,.62),
        0 0 48px rgba(255,66,143,.35),
        inset 0 1px rgba(255,255,255,.18);
      animation:menuIn .8s cubic-bezier(.2,.85,.3,1) both;
    }

    h1{
      margin:0;
      color:#fff7fb;
      font-family:"Cinzel", serif;
      font-size:clamp(28px, 8.5vw, 48px);
      font-weight:800;
      letter-spacing:clamp(1px, .8vw, 4px);
      line-height:.98;
      text-shadow:0 0 9px #fff, 0 0 26px #ff54a0, 0 0 57px #a61455;
    }

    .subtitle{
      margin:8px 0 0;
      color:#ffdce9;
      font-family:"Dancing Script", cursive;
      font-size:clamp(22px, 6.5vw, 34px);
      font-weight:700;
      text-shadow:0 0 13px rgba(255,112,173,.82);
    }

    .divider{
      width:min(220px, 68%);
      height:2px;
      margin:14px auto 12px;
      background:linear-gradient(90deg, transparent, #ffd4e4, #fff, #ffd4e4, transparent);
      box-shadow:0 0 15px #ff5b9f;
    }

    .coins-display{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin:0 auto 14px;
      padding:8px 18px;
      border:1px solid rgba(255,213,74,.55);
      border-radius:14px;
      background:rgba(0,0,0,.32);
      color:#fff;
      font-family:"Cinzel", serif;
      font-size:clamp(15px, 4.5vw, 18px);
      font-weight:800;
      letter-spacing:.5px;
      box-shadow:0 0 18px rgba(255,213,74,.35);
    }

    .coins-display i{ color:var(--coin); }

    .tabs{
      display:flex;
      gap:6px;
      margin:0 0 14px;
      padding:5px;
      border-radius:14px;
      background:rgba(0,0,0,.28);
      border:1px solid rgba(255,201,225,.2);
    }

    .tab{
      flex:1;
      padding:9px 6px;
      border:none;
      border-radius:10px;
      background:transparent;
      color:rgba(255,220,235,.72);
      font-family:"Cinzel", serif;
      font-size:clamp(10px, 3vw, 12px);
      font-weight:800;
      letter-spacing:.3px;
      cursor:pointer;
      transition:background .18s, color .18s;
    }

    .tab.active{
      background:linear-gradient(180deg, #dd4686, #8b1649);
      color:#fff;
      box-shadow:
        0 3px 0 #4b0829,
        inset 0 1px rgba(255,255,255,.25);
    }

    .tab-content{ animation:fadeIn .22s ease both; }
    .tab-content.hidden{ display:none; }

    .chars-grid{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:10px;
      margin-bottom:12px;
    }

    .char-card{
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:6px;
      padding:10px 8px;
      border:1px solid rgba(255,212,231,.32);
      border-radius:14px;
      background:linear-gradient(180deg, rgba(155,42,96,.85), rgba(63,8,35,.92));
      color:#fff7fb;
      font-family:inherit;
      cursor:pointer;
      transition:transform .12s ease, filter .12s ease, border-color .18s, box-shadow .18s;
      box-shadow:0 3px 0 rgba(45,3,22,.8), inset 0 1px rgba(255,255,255,.12);
    }

    .char-card.owned{
      border-color:rgba(255,213,74,.5);
      box-shadow:0 3px 0 rgba(45,3,22,.8), 0 0 14px rgba(255,213,74,.28), inset 0 1px rgba(255,255,255,.15);
    }

    .char-card.active{
      border-color:#55dc8b;
      box-shadow:0 3px 0 rgba(45,3,22,.8), 0 0 20px rgba(85,220,139,.55), inset 0 1px rgba(255,255,255,.2);
    }

    .char-card:active{
      transform:translateY(2px) scale(.98);
      filter:brightness(1.15);
    }

    .char-thumb{
      width:100%;
      aspect-ratio:1;
      max-width:88px;
      max-height:88px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:10px;
      background:rgba(0,0,0,.2);
      overflow:hidden;
      position:relative;
    }

    .char-thumb img{
      width:100%;
      height:100%;
      object-fit:contain;
      image-rendering:auto;
      pointer-events:none;
    }

    .char-thumb canvas, .modal-canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      display: block;
    }

    .char-name{
      font-family:"Cinzel", serif;
      font-size:clamp(12px, 3.4vw, 14px);
      font-weight:800;
      letter-spacing:.3px;
      color:#fff;
      line-height:1.1;
    }

    .char-status{
      font-size:clamp(10px, 2.8vw, 11px);
      font-weight:700;
      color:rgba(255,220,235,.82);
      line-height:1.15;
    }

    .char-card.active .char-status{ color:#55dc8b; }
    .char-card.owned .char-status{ color:var(--gold); }

    .item-card{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      padding:20px 16px;
      border:1px solid rgba(255,212,231,.35);
      border-radius:16px;
      background:linear-gradient(180deg, rgba(155,42,96,.55), rgba(63,8,35,.75));
    }

    .item-icon{
      font-size:42px;
      filter:drop-shadow(0 0 14px rgba(255,90,150,.75));
    }

    .item-icon.hp-icon{ color:#ff779d; }
    .item-icon.ammo-icon{ color:var(--gold); }

    .item-name{
      color:#fff;
      font-family:"Cinzel", serif;
      font-size:clamp(17px, 4.8vw, 22px);
      font-weight:800;
      letter-spacing:.4px;
    }

    .item-desc{
      color:rgba(255,225,235,.82);
      font-size:clamp(12px, 3.4vw, 14px);
      font-weight:600;
    }

    .buy-btn{
      margin-top:6px;
      padding:11px 18px;
      border:1px solid rgba(255,219,234,.6);
      border-radius:12px;
      background:linear-gradient(180deg, #dd4686, #8b1649);
      color:#fff;
      font-family:"Cinzel", serif;
      font-size:clamp(11px, 3.2vw, 13px);
      font-weight:800;
      letter-spacing:.4px;
      cursor:pointer;
      box-shadow:0 3px 0 #4b0829, inset 0 1px rgba(255,255,255,.25);
      transition:transform .12s ease, filter .12s ease;
    }

    .buy-btn:active:not(:disabled){
      transform:translateY(2px) scale(.98);
      filter:brightness(1.18);
    }

    .buy-btn:disabled{
      opacity:.5;
      cursor:not-allowed;
      filter:grayscale(.4);
    }

    .item-current{
      margin-top:6px;
      color:rgba(255,220,235,.82);
      font-size:clamp(11px, 3vw, 13px);
      font-weight:700;
    }

    .buttons{
      display:flex;
      flex-direction:column;
      gap:9px;
      margin-top:14px;
    }

    .menu-button{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      min-height:49px;
      gap:10px;
      padding:10px 15px;
      border:1px solid rgba(255,212,231,.62);
      border-radius:14px;
      background:linear-gradient(180deg, #dd4686, #8b1649);
      color:#fffaff;
      font-family:"Cinzel", serif;
      font-size:clamp(11px, 3.2vw, 13px);
      font-weight:800;
      letter-spacing:.45px;
      text-decoration:none;
      box-shadow:0 4px 0 #4b0829, inset 0 1px rgba(255,255,255,.27);
      transition:transform .12s ease, filter .12s ease, opacity .2s;
      cursor:pointer;
    }

    .menu-button.secondary{
      background:linear-gradient(180deg, #9d3666, #59142f);
    }

    .menu-button.gold{
      background:linear-gradient(180deg, #e5aa34, #a2610b);
      border-color:rgba(255,230,161,.72);
      box-shadow:0 4px 0 #5a3305, inset 0 1px rgba(255,255,255,.25);
    }

    .menu-button:active{
      transform:translateY(3px) scale(.98);
      filter:brightness(1.18);
    }

    .menu-button[hidden]{ display:none !important; }

    .modal{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(13,0,8,.8);
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease;
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
    }

    .modal.show{ opacity:1; pointer-events:auto; }

    .modal-box{
      position:relative;
      width:min(94vw, 380px);
      max-height:calc(100dvh - 40px);
      overflow-y:auto;
      padding:22px 18px 18px;
      border:1px solid rgba(255,199,222,.56);
      border-radius:20px;
      background:linear-gradient(145deg, rgba(103,19,61,.99), rgba(31,1,19,.99));
      box-shadow:0 15px 55px rgba(0,0,0,.62), 0 0 30px rgba(255,74,146,.28);
      text-align:center;
      transform:translateY(14px) scale(.96);
      transition:transform .25s ease;
    }

    .modal.show .modal-box{ transform:translateY(0) scale(1); }

    .modal-close{
      position:absolute;
      top:10px;
      right:10px;
      width:32px;
      height:32px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,212,231,.32);
      border-radius:50%;
      background:rgba(0,0,0,.35);
      color:#fff;
      font-size:15px;
      cursor:pointer;
    }

    .modal-img{
      display:block;
      width:min(180px, 55vw);
      height:min(180px, 55vw);
      margin:0 auto 12px;
      object-fit:contain;
      border-radius:14px;
      background:rgba(0,0,0,.18);
      padding:8px;
      image-rendering:auto;
    }

    #modal-gip-container {
      width:min(180px, 55vw);
      height:min(180px, 55vw);
      margin:0 auto 12px;
      border-radius:14px;
      background:rgba(0,0,0,.18);
      padding:8px;
      display:none;
    }

    .modal h2{
      margin:0 0 6px;
      color:#fff3f8;
      font-family:"Cinzel", serif;
      font-size:clamp(20px, 6vw, 26px);
      letter-spacing:1px;
    }

    .modal-status{
      margin-bottom:6px;
      color:rgba(255,225,235,.82);
      font-size:clamp(12px, 3.4vw, 14px);
      font-weight:700;
    }

    .modal-price{
      margin-bottom:14px;
      color:var(--coin);
      font-family:"Cinzel", serif;
      font-size:clamp(15px, 4.2vw, 18px);
      font-weight:800;
      letter-spacing:.5px;
    }

    .modal-actions{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    @keyframes menuIn{
      from{ opacity:0; transform:translateY(28px) scale(.92); }
      to{ opacity:1; transform:translateY(0) scale(1); }
    }
    @keyframes glowPulse{
      0%,100%{ transform:scale(.85); opacity:.45; }
      50%{ transform:scale(1.12); opacity:.9; }
    }
    @keyframes mazeMove{
      from{ transform:rotate(-8deg) translate3d(0,0,0); }
      to{ transform:rotate(-8deg) translate3d(52px,52px,0); }
    }
    @keyframes fadeIn{
      from{ opacity:0; transform:translateY(6px); }
      to{ opacity:1; transform:translateY(0); }
    }

    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="maze"></div>
  <div class="glow"></div>

  <main class="shop">
    <h1>SHOP</h1>
    <p class="subtitle">Il Mercato di Gip</p>
    <div class="divider"></div>

    <div class="coins-display">
      <i class="fas fa-coins"></i>
      <span id="shop-coins">0</span>
      <span>Monete</span>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="chars" type="button" role="tab">Personaggi</button>
      <button class="tab" data-tab="hp" type="button" role="tab">Vite</button>
      <button class="tab" data-tab="ammo" type="button" role="tab">Munizioni</button>
    </div>

    <!-- Tab: Personaggi -->
    <div class="tab-content" id="tab-chars">
      <div class="chars-grid" id="chars-grid"></div>
      <button id="reset-purchases-btn" class="menu-button secondary" type="button" style="margin-top:10px;">
        <i class="fas fa-trash-alt"></i>
        Reset Acquisti Personaggi
      </button>
    </div>

    <!-- Tab: Vite -->
    <div class="tab-content hidden" id="tab-hp">
      <div class="item-card">
        <i class="fas fa-heart item-icon hp-icon"></i>
        <div class="item-name">+1 Vita</div>
        <div class="item-desc">Aggiunge una vita al tuo totale</div>
        <button class="buy-btn" data-buy="hp" type="button">Acquista — 5000 ★</button>
        <div class="item-current">Vite attuali: <span id="current-hp">3</span> / 99</div>
      </div>
    </div>

    <!-- Tab: Munizioni -->
    <div class="tab-content hidden" id="tab-ammo">
      <div class="item-card">
        <i class="fas fa-crosshairs item-icon ammo-icon"></i>
        <div class="item-name">+3 Munizioni</div>
        <div class="item-desc">Aggiunge 3 munizioni al tuo totale</div>
        <button class="buy-btn" data-buy="ammo" type="button">Acquista — 3000 ★</button>
        <div class="item-current">Munizioni: <span id="current-ammo">3</span> / 99</div>
      </div>
    </div>

    <div class="buttons">
      <a href="#" id="continue-btn" class="menu-button" hidden>
        <i class="fas fa-play"></i> Continua il gioco
      </a>
      <a href="index.html" class="menu-button secondary">
        <i class="fas fa-home"></i> Torna al Menu
      </a>
    </div>
  </main>

  <!-- Modale personaggio -->
  <div id="char-modal" class="modal">
    <div class="modal-box">
      <button class="modal-close" id="modal-close" type="button" aria-label="Chiudi">
        <i class="fas fa-times"></i>
      </button>
      <img id="modal-img" class="modal-img" alt="">
      <div id="modal-gip-container" class="modal-canvas"></div>
      
      <h2 id="modal-name">Nome</h2>
      <div id="modal-status" class="modal-status"></div>
      <div id="modal-price" class="modal-price"></div>
      <div class="modal-actions">
        <button class="menu-button" id="modal-action-btn" type="button">Acquista</button>
        <button class="menu-button secondary" id="modal-cancel-btn" type="button">Annulla</button>
      </div>
    </div>
  </div>

  <script type="module" src="shop.js"></script>
</body>
</html>
