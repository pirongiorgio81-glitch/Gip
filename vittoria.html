<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a0010">
  <title>Vittoria — Il Labirinto di Gip</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Dancing+Script:wght@600;700&family=Source+Sans+3:wght@400;600;700;800&display=swap');
    :root{ --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
    *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body{
      width:100%; height:100%; margin:0; overflow:hidden;
      background:#19000e; color:#fff5fa;
      font-family:"Source Sans 3", Arial, sans-serif;
      touch-action:manipulation;
    }
    body{
      display:flex; align-items:center; justify-content:center;
      background: radial-gradient(circle at 50% 32%, #a62869 0%, #510c31 42%, #19000e 100%);
    }
    .glow{ position:fixed; width:75vw; max-width:480px; aspect-ratio:1; border-radius:50%;
      background:rgba(255, 149, 196, 0.18); filter:blur(28px);
      animation:pulse 2.6s ease-in-out infinite; pointer-events:none; }
    .stars{ position:fixed; inset:0; overflow:hidden; pointer-events:none; }
    .star{ position:absolute; color:#ffe4f0;
      text-shadow: 0 0 8px #ff5ba0, 0 0 18px #ff78b7;
      animation:float 5s ease-in-out infinite; }
    .victory{
      position:relative; z-index:2; width:min(92vw, 520px);
      max-height:calc(100dvh - 24px);
      padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
      overflow:auto;
      border:1px solid rgba(255, 213, 231, 0.6);
      border-radius:26px;
      background:linear-gradient(145deg, rgba(132, 26, 78, 0.92), rgba(43, 1, 25, 0.94));
      text-align:center;
      box-shadow: 0 18px 65px rgba(0,0,0,0.55), 0 0 45px rgba(255, 71, 145, 0.45), inset 0 1px rgba(255,255,255,0.22);
      animation:enter 0.8s cubic-bezier(.2,.85,.3,1) both;
    }
    .hearts{ margin-bottom:12px; font-size:clamp(28px, 9vw, 52px); letter-spacing:5px;
      filter:drop-shadow(0 0 12px rgba(255, 88, 157, 0.9));
      animation:hearts 1.4s ease-in-out infinite; }
    h1{ margin:0; color:#fff7fb; font-family:"Cinzel", serif;
      font-size:clamp(36px, 12vw, 68px); font-weight:800;
      letter-spacing:clamp(1px, 1vw, 7px); line-height:1;
      text-shadow: 0 0 8px #fff, 0 0 25px #ff4c98, 0 0 55px #a31454; }
    .line{ width:min(245px, 70%); height:2px; margin:20px auto 16px;
      background:linear-gradient(90deg, transparent, #ffd2e4, #fff, #ffd2e4, transparent);
      box-shadow:0 0 16px #ff5a9d; }
    .message{ margin:0 auto 8px; color:#ffe5f0; font-family:"Dancing Script", cursive;
      font-size:clamp(27px, 8vw, 44px); font-weight:700; line-height:1.12;
      text-shadow:0 0 14px rgba(255, 121, 181, 0.8); }
    .text{ max-width:360px; margin:16px auto 22px; color:#ffe9f2;
      font-size:17px; font-weight:600; line-height:1.38; }
    .final-stats{ margin:16px auto 20px; padding:14px; max-width:320px;
      background:rgba(0, 0, 0, 0.3);
      border:1px solid rgba(255, 213, 231, 0.22); border-radius:12px; text-align:left; }
    .final-stats .stats-title{ margin-bottom:10px; color:#ffd54a;
      font-family:"Cinzel", serif; font-size:13px; font-weight:800;
      letter-spacing:1px; text-align:center; }
    .final-stats .stat-row{ display:flex; align-items:center; justify-content:space-between;
      margin:6px 0; color:#ffe5ef; font-size:15px; font-weight:600; }
    .final-stats .stat-row span{ color:#fff; font-weight:800; }
    .final-stats .stat-row i{ width:22px; margin-right:8px; color:#ff8abb; text-align:center; }
    .buttons{ display:flex; flex-direction:column; gap:10px; width:min(100%, 290px); margin:0 auto; }
    .btn{ display:flex; align-items:center; justify-content:center;
      min-height:50px; gap:9px; padding:10px 16px;
      border:1px solid rgba(255, 219, 234, 0.58); border-radius:14px;
      background:linear-gradient(180deg, #d94080, #8a1549);
      color:#fffafd; font-family:"Cinzel", serif; font-size:13px; font-weight:800;
      letter-spacing:0.4px; text-decoration:none;
      box-shadow: 0 4px 0 #4c082a, inset 0 1px rgba(255,255,255,0.25);
      transition:transform .12s ease, filter .12s ease; cursor:pointer; }
    .btn.secondary{ background:linear-gradient(180deg, #d79d2b, #945709);
      border-color:rgba(255, 229, 159, 0.7);
      box-shadow: 0 4px 0 #563104, inset 0 1px rgba(255,255,255,0.25); }
    .btn:active{ transform:translateY(3px) scale(.98); filter:brightness(1.2); }
    .footer{ margin:19px 0 0; color:rgba(255, 220, 235, 0.74); font-size:13px; font-weight:600; }
    @keyframes enter{ from{ opacity:0; transform:translateY(28px) scale(.91); } to{ opacity:1; transform:translateY(0) scale(1); } }
    @keyframes pulse{ 0%,100%{ transform:scale(.86); opacity:.42; } 50%{ transform:scale(1.12); opacity:.9; } }
    @keyframes hearts{ 0%,100%{ transform:scale(.96) rotate(-2deg); } 50%{ transform:scale(1.08) rotate(2deg); } }
    @keyframes float{ 0%,100%{ opacity:.15; transform:translateY(0) rotate(0deg); } 50%{ opacity:1; transform:translateY(-24px) rotate(18deg); } }
    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="stars" id="stars"></div>

  <main class="victory">
    <div class="hearts">💗 💖 💘 💕 💗</div>
    <h1>VITTORIA!</h1>
    <div class="line"></div>
    <p class="message">Gip ha conquistato il Labirinto!</p>
    <p class="text">
      Hai raccolto tutte le foglie magiche, superato le ombre
      e liberato il cuore del labirinto.
    </p>

    <div class="final-stats">
      <div class="stats-title">RIEPILOGO FINALE</div>
      <div class="stat-row"><span><i class="fas fa-clock"></i>Tempo totale</span><span id="final-time">--:--</span></div>
      <div class="stat-row"><span><i class="fas fa-shoe-prints"></i>Mosse totali</span><span id="final-moves">0</span></div>
      <div class="stat-row"><span><i class="fas fa-coins"></i>Monete raccolte</span><span id="final-coins">0</span></div>
    </div>

    <div class="buttons">
      <a class="btn" href="1.html" id="restart-button">
        <i class="fas fa-redo"></i> Ricomincia l'avventura
      </a>
      <a class="btn secondary" href="index.html" id="menu-button">
        <i class="fas fa-home"></i> Torna al menu
      </a>
    </div>

    <p class="footer">Il Labirinto di Gip 💗</p>
  </main>

  <script>
    try{
      const cum = JSON.parse(localStorage.getItem('labirinto_cumulative') || '{"time":0,"moves":0,"coins":0}');
      const m = Math.floor((cum.time || 0) / 60);
      const s = (cum.time || 0) % 60;
      const timeEl = document.getElementById('final-time');
      const movesEl = document.getElementById('final-moves');
      const coinsEl = document.getElementById('final-coins');
      if(timeEl) timeEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      if(movesEl) movesEl.textContent = String(cum.moves || 0);
      if(coinsEl) coinsEl.textContent = String(cum.coins || 0);
    }catch(_){}

    function fullReset(){
      try{
        localStorage.removeItem('labirinto_next_url');
        localStorage.removeItem('labirinto_state');
        localStorage.removeItem('labirinto_resume');
        localStorage.removeItem('labirinto_cumulative');
        localStorage.removeItem('labirinto_hp');
        localStorage.removeItem('labirinto_shields');
        localStorage.removeItem('labirinto_ammo');
        // Monete, personaggi e difficoltà restano.
      }catch(_){}
    }

    const restartBtn = document.getElementById('restart-button');
    if(restartBtn){
      restartBtn.addEventListener('click', () => fullReset());
    }

    try{
      localStorage.removeItem('labirinto_state');
      localStorage.removeItem('labirinto_resume');
      localStorage.removeItem('labirinto_hp');
      localStorage.removeItem('labirinto_shields');
      localStorage.removeItem('labirinto_ammo');
      localStorage.removeItem('labirinto_next_url');
    }catch(_){}

    const stars = document.getElementById('stars');
    const symbols = ['💗', '💖', '💘', '💕', '💓', '✦', '✧', '🌸'];
    for(let i = 0; i < 26; i++){
      const star = document.createElement('span');
      star.className = 'star';
      star.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      star.style.left = (Math.random() * 100) + '%';
      star.style.top = (Math.random() * 100) + '%';
      star.style.fontSize = (15 + Math.random() * 26) + 'px';
      star.style.animationDuration = (2.5 + Math.random() * 3.5) + 's';
      star.style.animationDelay = (-Math.random() * 5) + 's';
      stars.appendChild(star);
    }
  </script>
</body>
</html>
